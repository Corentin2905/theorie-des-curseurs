<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Théorie des Curseurs</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Manrope:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    background: #1c1c1c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* LOGIN */
#login {
    text-align: center;
    color: #c47a2c;
}

input[type="password"] {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #262626;
    color: white;
}

button {
    padding: 10px 15px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #c47a2c;
    color: #1c1c1c;
    cursor: pointer;
}

/* APP */
.container {
    background: #262626;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    width: 360px;
}

.title {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: #c47a2c;
}

.total {
    text-align: center;
    font-size: 28px;
    margin: 15px 0 25px;
    font-weight: 600;
}

.slider-group {
    margin-bottom: 22px;
}

label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #d1d1d1;
}

/* 🎛️ CURSEURS MIXER */

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: #444;
    border-radius: 2px;
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    background: linear-gradient(to right, #c47a2c, #8c5520);
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 24px;
    background: #c47a2c;
    border-radius: 3px;
    cursor: pointer;
    margin-top: -10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}

.nav {
    text-align: center;
    margin-top: 20px;
}

canvas {
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="login">
    <h2>Accès privé</h2>
    <input type="password" id="password">
    <br>
    <button onclick="checkPassword()">Entrer</button>
</div>

<div id="app" style="display:none;">
<div class="container">

<!-- PAGE 1 -->
<div id="page1">
<div class="title">Théorie des Curseurs</div>
<div id="total" class="total">Total : 0</div>
<div id="sliders"></div>

<button onclick="saveData()">Enregistrer</button>

<div class="nav">
<button onclick="showPage2()">Voir évolution</button>
</div>
</div>

<!-- PAGE 2 -->
<div id="page2" style="display:none;">
<div class="title">Évolution</div>
<canvas id="chart"></canvas>

<div class="nav">
<button onclick="showPage1()">Retour</button>
</div>
</div>

</div>
</div>

<script>
const PASSWORD = "Curseurs";

// 🎛️ LABELS
const labels = [
    "🏡 Famille",
    "🍺 Social",
    "❤️ Cœur",
    "🎥 Travail",
    "💪 Santé"
];

let values = [0,0,0,0,0];

const slidersContainer = document.getElementById("sliders");
const totalDisplay = document.getElementById("total");

// LOGIN
function checkPassword() {
    if (document.getElementById("password").value === PASSWORD) {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        alert("Mot de passe incorrect");
    }
}

// TOTAL
function updateTotal() {
    const total = values.reduce((a,b)=>a+b,0);
    totalDisplay.textContent = "Total : " + total;

    if (total === 50) {
        totalDisplay.style.color = "#c47a2c";
    } else {
        totalDisplay.style.color = "#b0b0b0";
    }
}

// SLIDERS
function createSlider(index) {
    const group = document.createElement("div");
    group.className = "slider-group";

    const label = document.createElement("label");
    label.innerHTML = `${labels[index]} <span id="val${index}">0</span>`;

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = 0;
    slider.max = 20;

    slider.oninput = (e) => {
        const val = parseInt(e.target.value);
        values[index] = val;

        e.target.style.background =
        `linear-gradient(to right, #c47a2c ${val*5}%, #444 ${val*5}%)`;

        document.getElementById("val"+index).textContent = val;
        updateTotal();
    };

    group.appendChild(label);
    group.appendChild(slider);
    slidersContainer.appendChild(group);
}

labels.forEach((_,i)=>createSlider(i));
updateTotal();

// SAVE
function saveData() {
    const data = JSON.parse(localStorage.getItem("history") || "[]");

    data.push({
        date: new Date().toLocaleDateString(),
        values: [...values]
    });

    localStorage.setItem("history", JSON.stringify(data));
    alert("Enregistré");
}

// NAV
function showPage2() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
    renderChart();
}

function showPage1() {
    document.getElementById("page2").style.display = "none";
    document.getElementById("page1").style.display = "block";
}

// GRAPH
function renderChart() {
    const data = JSON.parse(localStorage.getItem("history") || "[]");

    new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
            labels: data.map(d => d.date),
            datasets: labels.map((label,i)=>({
                label,
                data: data.map(d=>d.values[i]),
                borderColor: "#c47a2c",
                tension: 0.3
            }))
        }
    });
}
</script>

</body>
</html>
